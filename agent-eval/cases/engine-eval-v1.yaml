version: engine-eval-v1
name: 智能引擎效果/速度/过程联合评估集
description: >-
  面向「智能引擎」（agent-runtime 流式问答主链路）的端到端评估集。每个用例同时记录并评估三类信号：
  效果（意图/领域/动作是否正确、是否拒绝越权、是否给出可用回答）、
  速度（首个可见反馈 ttfb、首 token ttft、总时延 done 是否在预算内）、
  过程（trace 事件流是否完整有序、过程事件是否悬挂）。
  配套 runner 为 scripts/run_engine_eval.py，直连 agent-runtime /v1/agent/runs/stream 采集真实时延与 trace。

# 与生产链路对齐：Java 后端固定注入 metadata.profile=job-buddy，评估请求必须一致，
# 否则 runtime 落到 default profile，意图全部塌缩为 general.chat。
runtime_profile: job-buddy

# Runtime 流式事件契约：processing(首个可见反馈) -> reasoning(可选) -> token(答案增量) -> done(终态聚合)
runtime_stream_contract:
  events: [processing, reasoning, token, done]
  done_payload: [run_id, trace_id, status, stop_reason, answer, reasoning, latency_ms, metrics, resumable, trace_events]
  required_trace_events: [run_start, understand_goal, task_understanding, capability_route, finalize, run_end]

# Checkpoint 恢复创建新的运行链路；恢复 Trace 不要求重复出现已跳过的早期节点，
# 但必须保留来源 run/stage，并以 run_resumed 明确记录血缘。
checkpoint_recovery_contract:
  request_field: resume_from_run_id
  response_fields: [run_id, trace_id, resumed_from_run_id, resumed_from_stage]
  required_trace_events: [run_start, run_resumed, finalize, run_end]
  source_run_single_use: true
  owner_scope_required: true
  source_turn_binding_required: true
  synthesis_only_after_finalize_stream_failure: true
  structured_replan_stop_reasons: [invalid_plan_dependency]
  structured_replan_source_stage: tool_search
  max_invalid_plan_replan_attempts: 2

# 风控约束：默认只跑不触达 Boss 的安全路径。标记 requires_live_boss 的用例需显式 --allow-boss 才执行，
# 避免评估迭代期间高频请求 Boss 触发验证码/安全验证/限速。命中风控信号必须立即停手。
risk_control:
  default_skip_live_boss: true
  stop_on_boss_challenge: true
  notes: >-
    job.recommend / resume.match 等用例依赖真实 Boss 登录态与在线数据，属高风控敏感路径。
    评估时优先用安全路径（开放域问答、澄清、安全拦截、会话捷径）做高频回归，
    Boss 相关用例低频人工触发，凭证从 PostgreSQL auth_state 注入 Tool 内存，禁止本地凭证目录。

# 速度预算默认值，可被单用例覆盖。单位毫秒。target 内满分，达到 max 记 0，区间线性衰减。
latency_budget_defaults:
  ttfb_ms_target: 500
  ttfb_ms_max: 1500
  ttft_ms_target: 3000
  ttft_ms_max: 7000
  done_ms_target: 8000
  done_ms_max: 15000
  min_score: 0.6

cases:
  # ---- 会话捷径快路径：规则路由命中即跳过理解 LLM，应当最快 ----
  - id: shortcut_refresh_batch
    category: shortcut_fast_path
    input: "换一批"
    preconditions: [jobs_loaded]
    requires_live_boss: true
    expected:
      domain: job
      intent: job.recommend
      router_in: [semantic_config_shortcut, llm]
      events: [intent, job_cards, done]
    latency_budget:
      ttfb_ms_target: 300
      ttfb_ms_max: 800
      ttft_ms_target: 800
      ttft_ms_max: 2000
      done_ms_target: 4000
      done_ms_max: 9000

  # ---- 受校验 Hint 快路径：仅做瞬时理解，不调用模型、工具或 Boss ----
  - id: validated_hint_resume_match_understanding
    category: understanding_fast_path
    input: "分析当前简历与目标岗位的匹配度"
    metadata:
      understanding_only: true
      intent_hint:
        domain: job
        intent: resume.match
        confidence: 0.88
        risk: low
        needs_clarification: false
        next_action: run_resume_match
        router: rule
    expected:
      domain: job
      intent: resume.match
      next_action: run_resume_match
      router_in: [validated_intent_hint]
      expect_status: success
      expect_no_llm_usage: true
      trace_events: [run_start, understand_goal, task_understanding, capability_route, finalize, run_end]
    latency_budget:
      ttfb_ms_target: 300
      ttfb_ms_max: 800
      ttft_ms_target: null
      ttft_ms_max: null
      done_ms_target: 800
      done_ms_max: 2000

