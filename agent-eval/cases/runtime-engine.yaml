schema_version: 1
id: runtime-engine
version: 1
name: 智能引擎效果/速度/过程联合评估集
description: 面向「智能引擎」（agent-runtime 流式问答主链路）的端到端评估集。每个用例同时记录并评估三类信号： 效果（意图/领域/动作是否正确、是否拒绝越权、是否给出可用回答）、 速度（首个可见反馈
  ttfb、首 token ttft、总时延 done 是否在预算内）、 过程（trace 事件流是否完整有序、过程事件是否悬挂）。 配套 runner 为 scripts/run_engine_eval.py，直连 agent-runtime
  /v1/agent/runs/stream 采集真实时延与 trace。
kind: runtime
defaults:
  runtime_profile: job-buddy
  latency_budget:
    ttfb_ms_target: 500
    ttfb_ms_max: 1500
    ttft_ms_target: 3000
    ttft_ms_max: 7000
    done_ms_target: 8000
    done_ms_max: 15000
    min_score: 0.6
fixtures: {}
contracts:
  runtime_stream_contract:
    events:
      - processing
      - reasoning
      - token
      - done
    done_payload:
      - run_id
      - trace_id
      - status
      - stop_reason
      - answer
      - reasoning
      - latency_ms
      - metrics
      - resumable
      - trace_events
    required_trace_events:
      - run_start
      - understand_goal
      - task_understanding
      - capability_route
      - finalize
      - run_end
  checkpoint_recovery_contract:
    request_field: resume_from_run_id
    response_fields:
      - run_id
      - trace_id
      - resumed_from_run_id
      - resumed_from_stage
    required_trace_events:
      - run_start
      - run_resumed
      - finalize
      - run_end
    source_run_single_use: true
    owner_scope_required: true
    source_turn_binding_required: true
    synthesis_only_after_finalize_stream_failure: true
    structured_replan_stop_reasons:
      - invalid_plan_dependency
    structured_replan_source_stage: tool_search
    max_invalid_plan_replan_attempts: 2
  risk_control:
    default_skip_live_boss: true
    stop_on_boss_challenge: true
    notes: job.recommend / resume.match 等用例依赖真实 Boss 登录态与在线数据，属高风控敏感路径。 评估时优先用安全路径（开放域问答、澄清、安全拦截、会话捷径）做高频回归， Boss
      相关用例低频人工触发，凭证从 PostgreSQL auth_state 注入 Tool 内存，禁止本地凭证目录。
