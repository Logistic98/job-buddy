      ids:
        - city
        - salary
  - id: memory_search_22
    category: multi_fact_retrieval
    description: 编程技术和目标职位分别是什么？
    input:
      operation: search
      query: 编程技术和目标职位分别是什么？
    expected:
      ids:
        - stack
        - role
  - id: memory_search_23
    category: multi_fact_retrieval
    description: 对通勤时间和居家办公有哪些要求？
    input:
      operation: search
      query: 对通勤时间和居家办公有哪些要求？
    expected:
      ids:
        - commute
        - remote
  - id: memory_search_24
    category: multi_fact_retrieval
    description: 外包公司和大小周是否可以接受？
    input:
      operation: search
      query: 外包公司和大小周是否可以接受？
    expected:
      ids:
        - outsourcing
        - schedule
  - id: memory_search_25
    category: semantic_retrieval
    description: 从原单位交接到可入职需要几周？
    input:
      operation: search
      query: 从原单位交接到可入职需要几周？
    expected:
      ids:
        - notice
  - id: memory_search_26
    category: semantic_retrieval
    description: 医疗科技是不是优先考虑的行业？
    input:
      operation: search
      query: 医疗科技是不是优先考虑的行业？
    expected:
      ids:
        - industry
  - id: memory_search_27
    category: semantic_retrieval
    description: 一趟上班希望控制在多少分钟？
    input:
      operation: search
      query: 一趟上班希望控制在多少分钟？
    expected:
      ids:
        - commute
  - id: memory_search_28
    category: semantic_retrieval
    description: 不去办公室办公的天数期望是多少？
    input:
      operation: search
      query: 不去办公室办公的天数期望是多少？
    expected:
      ids:
        - remote
  - id: memory_update_city
    category: fact_update
    description: 显式更新后返回新事实并排除旧事实。
    input:
      operation: update
      fact_id: city
      content: 长期求职目标城市改为杭州。
      query: 现在打算在哪座城市找工作？
    expected:
      content: 长期求职目标城市改为杭州。
      previous_content_absent: true
  - id: memory_update_salary
    category: fact_update
    description: 显式更新后返回新事实并排除旧事实。
    input:
      operation: update
      fact_id: salary
      content: 期望月薪税前 40000 到 50000 元。
      query: 最新的薪资期望是多少？
    expected:
      content: 期望月薪税前 40000 到 50000 元。
      previous_content_absent: true
  - id: memory_update_remote
    category: fact_update
    description: 更新后应检索到新事实且不出现旧事实。
    input:
      operation: update
      fact_id: remote
      content: 远程办公偏好改为每周一天在家办公。
      query: 现在每周希望几天居家办公？
    expected:
      content: 远程办公偏好改为每周一天在家办公。
      previous_content_absent: true
  - id: memory_update_notice
    category: fact_update
    description: 更新后应检索到新事实且不出现旧事实。
    input:
      operation: update
      fact_id: notice
      content: 离职交接时间改为两周。
      query: 最新到岗前交接需要几周？
    expected:
      content: 离职交接时间改为两周。
      previous_content_absent: true
