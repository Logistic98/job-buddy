    options:
      preconditions:
        - jobs_loaded
  - id: complex_engineering_qa_request
    category: job_workflow
    description: 帮我设计一个支撑千万级并发的秒杀系统架构
    input:
      message: 帮我设计一个支撑千万级并发的秒杀系统架构
    expected:
      domain: runtime
      intent: complex_engineering_qa
      runtime_capability: runtime.complex_engineering_qa
      forbidden_intent: job.recommend
      events:
