    description: Python 生成器和迭代器有什么区别
    input:
      message: Python 生成器和迭代器有什么区别
    expected:
      domain: open_domain
      intent: technical_qa
      runtime_capability: open_domain.technical_qa
      forbidden_intent: job.recommend
      events:
        - intent
        - message
        - done
      next_action: run_runtime_planner
      outcomes:
        - 用户可见结果符合请求；所有结构化期望成立，失败不得伪装完成。
    options:
      preconditions: []
  - id: code_generation_not_job_search
    category: job_workflow
    description: 写 Python 代码统计字符串 JobBuddy 中字母 d 的出现次数，并执行验证
    input:
      message: 写 Python 代码统计字符串 JobBuddy 中字母 d 的出现次数，并执行验证
    expected:
      domain: runtime
      intent: code_generation_task
      runtime_capability: runtime.code_generation_task
      forbidden_intent: job.recommend
      required_tools:
        - sandbox_code_execute
      next_action: run_runtime_planner
      outcomes:
        - 用户可见结果符合请求；所有结构化期望成立，失败不得伪装完成。
    options:
      preconditions: []
  - id: runtime_code_task_not_job_search
    category: job_workflow
    description: 写 Python 代码统计字符串 JobBuddy 中字母 d 的出现次数，并执行验证
    input:
      message: 写 Python 代码统计字符串 JobBuddy 中字母 d 的出现次数，并执行验证
    expected:
      domain: runtime
      intent: code_generation_task
      next_action: run_runtime_planner
      forbidden_intent: job.recommend
      required_tools:
        - sandbox_code_execute
      trace_events:
        - run_start
        - task_understanding
        - capability_route
        - tool_search
        - plan_created
        - tool_execute_start
        - tool_execute_end
        - finalize
        - run_end
      outcomes:
        - 用户可见结果符合请求；所有结构化期望成立，失败不得伪装完成。
    options:
      preconditions: []
  - id: career_profile_context_injected
    category: job_workflow
    description: 帮我分析这个岗位适不适合
    input:
      message: 帮我分析这个岗位适不适合
      metadata:
        personal_context:
          user_profile:
            target_roles:
              - Agent 应用开发
            target_cities:
              - 上海
            salary_range: 40-50K
            hard_excludes:
              - 外包
              - 驻场
    expected:
      forbidden_actions:
        - auto_apply
        - auto_chat
      outcomes:
        - 结果引用输入画像的岗位方向、城市、薪资与排除条件。
    options:
      preconditions: []
  - id: open_domain_should_not_overfit_career
    category: job_workflow
    description: 解释一下现金流折现法
    input:
      message: 解释一下现金流折现法
      metadata:
        personal_context:
          user_profile:
            target_roles:
              - Agent 平台开发
    expected:
      domain: open_domain
      intent: general_qa
      outcomes:
        - 回答不强行关联求职画像，不触发岗位搜索。
    options:
      preconditions: []
  - id: resume_analyze_request
    category: job_workflow
    description: 帮我分析下我这份简历的优缺点
    input:
      message: 帮我分析下我这份简历的优缺点
    expected:
