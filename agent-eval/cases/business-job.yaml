  - id: technical_open_domain_qa
    category: job_workflow
    description: RAG 中 Cross-Encoder 重排的作用是什么
    input:
      message: RAG 中 Cross-Encoder 重排的作用是什么
    expected:
      domain: open_domain
      intent: technical_qa
      events:
        - intent
        - message
        - done
      outcomes:
        - 用户可见结果符合请求；所有结构化期望成立，失败不得伪装完成。
    options:
