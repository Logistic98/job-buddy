  - id: stream_failure_no_duplicate_transaction
    category: recovery
    description: 业务写入完成后流式连接断开。
    input:
      message: 业务写入完成后流式连接断开。
    expected:
      outcomes:
        - 恢复不得重放已完成写入；终态可解释，不能生成重复业务记录。
    options:
      preconditions:
        - completed_business_write
        - stream_disconnect
