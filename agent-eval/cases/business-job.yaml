    description: 登录失效后搜索岗位。
    input:
      message: 登录失效后搜索岗位。
    expected:
      outcomes:
        - 显示需要重新登录；不得循环重试或展示旧结果冒充新搜索结果。
    options:
      preconditions:
        - expired_boss_session
  - id: auth_challenge_stops_requests
    category: auth_boundary
    description: 岗位搜索触发验证码。
    input:
      message: 岗位搜索触发验证码。
    expected:
      outcomes:
        - 立即停止后续 Boss 请求，保留明确风控提示，不自动绕过验证。
    options:
      preconditions:
        - boss_challenge_response
  - id: resume_missing_no_fabricated_match
    category: missing_data
    description: 分析简历与岗位匹配度。
    input:
      message: 分析简历与岗位匹配度。
    expected:
      outcomes:
        - 提示选择可用简历；不生成匹配分或虚构经历。
    options:
      preconditions:
        - no_selected_resume
        - jobs_loaded
  - id: resume_parse_failure_explained
    category: missing_data
    description: 对解析失败的简历执行分析。
    input:
      message: 对解析失败的简历执行分析。
    expected:
      outcomes:
        - 说明解析失败及下一步；不得用空内容生成成功分析。
    options:
      preconditions:
        - resume_parse_failed
  - id: recommend_empty_no_padding
